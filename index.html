    .contenedor-header {
      position: fixed;
      top: 0;
      width: 100%;

      z-index: 1000;
      border-bottom: 1px solid #1e293b;
    }

    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo a {
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 1px;
      color: #38bdf8;
    }

    nav ul {
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav ul li a:hover {
      color: #38bdf8;
    }

    .acciones-header {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .btn-idioma {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .idioma-activo {
      color: #38bdf8;
      font-weight: 700;
    }

    .idioma-inactivo {
      color: #94a3b8;
    }

    .nav-responsive {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    section {

      margin: 0 auto;
    }

    .contenido-seccion h2 {
      font-size: 2rem;
      text-align: center;
      margin-bottom: 40px;
      color: #38bdf8;
      position: relative;
    }

      min-height: 100vh;

      justify-content: center;
      align-items: center;
      text-align: center;
      padding-top: 100px;
    }

      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #38bdf8;
      margin-bottom: 20px;
