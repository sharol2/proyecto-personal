<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHAROL BELTRÁN · Estudiante de Ingeniería de Sistemas</title>
  <meta name="description" content="Portafolio de Sharol Beltrán, estudiante de Ingeniería de Sistemas interesada en programación, desarrollo web y tecnología.">

  <!-- ICONOS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- FUENTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul {
      list-style: none;
    }

    /* HEADER Y NAVEGACIÓN */
    .contenedor-header {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      z-index: 1000;
      border-bottom: 1px solid #1e293b;
    }

    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo a {
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 1px;
      color: #38bdf8;
    }

    nav ul {
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav ul li a:hover {
      color: #38bdf8;
    }

    .acciones-header {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .btn-idioma {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .idioma-activo {
      color: #38bdf8;
      font-weight: 700;
    }

    .idioma-inactivo {
      color: #94a3b8;
    }

    .nav-responsive {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* SECCIONES BASE */
    section {
      padding: 80px 20px;
    }

    .contenido-seccion {
      max-width: 1100px;
      margin: 0 auto;
    }

    .contenido-seccion h2 {
      font-size: 2rem;
      text-align: center;
      margin-bottom: 40px;
      color: #38bdf8;
      position: relative;
    }

    /* INICIO / HERO */
    .inicio {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-top: 100px;
    }

    .contenedor-img img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #38bdf8;
      margin-bottom: 20px;
    }

    .contenido-banner h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
    }

    .contenido-banner h2 {
      font-size: 1.1rem;
      font-weight: 400;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .redes a {
      font-size: 1.4rem;
      margin: 0 10px;
      color: #f8fafc;
      transition: color 0.3s;
    }

    .redes a:hover {
      color: #38bdf8;
    }

    /* SOBRE MÍ */
    .sobremi p {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 40px;
      color: #cbd5e1;
    }

    .fila {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
    }

    .col {
      flex: 1;
      min-width: 280px;
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
    }

    .col h3 {
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .datos li {
      margin-bottom: 12px;
    }

    .datos strong {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .contenedor-intereses {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .interes {
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .interes i {
      display: block;
      font-size: 1.5rem;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .interes span {
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* HABILIDADES */
    .skill {
      margin-bottom: 20px;
    }

    .skill-nombre {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .barra-skill {
      width: 100%;
      background: #0f172a;
      height: 10px;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progreso {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      border-radius: 10px;
      transition: width 1.2s ease-in-out;
      position: relative;
    }

    .progreso span {
      position: absolute;
      right: 5px;
      top: -22px;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* FORMACIÓN Y EXPERIENCIA */
    .item {
      position: relative;
      padding-left: 20px;
      border-left: 2px solid #38bdf8;
      margin-bottom: 25px;
    }

    .item h4 {
      font-size: 1.1rem;
    }

    .casa, .fecha {
      display: inline-block;
      font-size: 0.8rem;
      color: #38bdf8;
      margin-right: 10px;
    }

    .item p {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-top: 8px;
    }

    /* PROYECTOS */
    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .proyecto {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #1e293b;
      min-height: 180px;
      display: flex;
      align-items: flex-end;
    }

    .proyecto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }

    .overlay {
      position: relative;
      z-index: 2;
      background: linear-gradient(transparent, rgba(15, 23, 42, 0.95));
      width: 100%;
      padding: 20px;
    }

    .overlay h3 {
      font-size: 1.1rem;
      color: #fff;
    }

    .overlay p {
      font-size: 0.8rem;
      color: #38bdf8;
    }

    /* CONTACTO */
    .contacto-intro {
      text-align: center;
      margin-bottom: 30px;
      color: #cbd5e1;
    }

    .tarjetas-contacto {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .tarjeta {
      background: #1e293b;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
      transition: transform 0.3s;
    }

    .tarjeta:hover {
      transform: translateY(-5px);
    }

    .tarjeta i {
      font-size: 2rem;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .tarjeta strong {
      display: block;
      margin-bottom: 5px;
    }

    .tarjeta span {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 40px 20px;
      background: #090d16;
      border-top: 1px solid #1e293b;
    }

    .arriba {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      width: 40px;
      height: 40px;
      line-height: 40px;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    .footer-nota {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* MEDIA QUERIES */
    @media (max-width: 768px) {
      nav {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: #0f172a;
        padding: 20px;
        border-bottom: 1px solid #1e293b;
      }

      nav.responsive {
        display: block;
      }

      nav ul {
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .nav-responsive {
        display: block;
      }
    }
  </style>
</head>
