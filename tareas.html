
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de tareas</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#fff1f7;color:#493743;padding:30px 15px}
main{max-width:550px;margin:40px auto;background:white;padding:25px;border-radius:18px;box-shadow:0 5px 20px #e8bfd2}
h1{text-align:center;color:#d65b91}
.formulario{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px;border:1px solid #e6b5cb;border-radius:8px}
button{border:0;border-radius:8px;padding:11px 15px;background:#d65b91;color:white;cursor:pointer}
button:hover{background:#b94478}
ul{padding:0}
li{display:flex;align-items:center;gap:10px;padding:12px 5px;border-bottom:1px solid #f3d5e4}
li span{flex:1;overflow-wrap:anywhere}
li.completada span{text-decoration:line-through;color:#999}
.eliminar{background:#9d456e}
.volver{display:block;text-align:center;margin-top:25px;color:#c34c83}
</style>
</head>
<body>
<main>
<h1>Mi lista de tareas</h1>
<p>Escribe las actividades que necesitas realizar.</p>
<div class="formulario">
<input id="nuevaTarea" type="text" placeholder="Escribe una tarea">
<button onclick="agregarTarea()">Agregar</button>
</div>
<ul id="listaTareas"></ul>
<a class="volver" href="../index.html">Volver al portafolio</a>
</main>
<script>
function agregarTarea(){
 const campo=document.getElementById("nuevaTarea");
 const texto=campo.value.trim();
 if(!texto){alert("Por favor, escribe una tarea.");return;}
 const li=document.createElement("li");
 const check=document.createElement("input");
 check.type="checkbox";
 check.addEventListener("change",()=>li.classList.toggle("completada",check.checked));
 const span=document.createElement("span");
 span.textContent=texto;
 const eliminar=document.createElement("button");
 eliminar.textContent="Eliminar";
 eliminar.className="eliminar";
 eliminar.addEventListener("click",()=>li.remove());
 li.append(check,span,eliminar);
 document.getElementById("listaTareas").appendChild(li);
 campo.value="";
 campo.focus();
}
document.getElementById("nuevaTarea").addEventListener("keydown",e=>{
 if(e.key==="Enter")agregarTarea();
});
</script>
</body>
</html>
